<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depix</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div>
        <div class="help">
          This app detects the scale factor of an upscaled pixel art image and
          scales it down for you. You can right-click the result image to save
          or copy it.
          <br />
          Implementation: <a href="https://twitter.com/akx">@akx</a>, algorithm:
          <a href="https://twitter.com/ochrons">@ochrons</a>
        </div>
        <label>
          Pick a pixel art image:&nbsp;
          <input id="file-input" type="file" accept="image/*" />
        </label>
        <label class="check">
          <input id="advanced-toggle" type="checkbox" />
          Advanced mode
        </label>
        <div id="advanced" hidden>
          <div class="help">
            Set sampling offset and step (fractional px) manually below.
          </div>
          <div class="controls">
            <label>
              Offset X
              <input id="offset-x" type="number" value="0" min="0" step="0.05" />
            </label>
            <label>
              Offset Y
              <input id="offset-y" type="number" value="0" min="0" step="0.05" />
            </label>
            <label>
              Step X
              <input id="step-x" type="number" value="1" min="1" step="0.05" />
            </label>
            <label>
              Step Y
              <input id="step-y" type="number" value="1" min="1" step="0.05" />
            </label>
          </div>
          <label class="check">
            <input id="link-xy" type="checkbox" checked />
            Link X and Y steps
          </label>
        </div>
      </div>
      <canvas id="original-canvas"></canvas>
      <div id="output-pane">
        <div id="status"></div>
        <canvas id="scaled-canvas" class="pixelated"></canvas>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
